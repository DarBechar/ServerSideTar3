<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Console</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css"
    />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../AjaxCall.js"></script>
    <script src="../admin/admin.js"></script>
    <style>
      body {
        background-color: #c8c8c8;
      }

      .nav {
        background-color: #4a1b47;
      }
      .nav-link,
      .navbar-brand {
        color: white;
      }
      .nav-link:hover,
      .navbar-brand:hover {
        color: #c0a2be;
      }
    </style>
  </head>
  <body>
    <ul class="nav d-flex justify-content-between w-100">
      <div class="d-flex">
        <li class="nav-item">
          <a class="nav-link" href="../HomePage/index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../WishList/WishList.html">WishList</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../Cast/Cast.Html">Cast</a>
        </li>
      </div>
      <div class="d-flex align-items-center">
        <li class="nav-item" id="userSection"></li>
      </div>
    </ul>

    <div class="container-fluid">
      <div class="row mt-4">
        <!-- Users List Section -->
        <div class="col-md-4">
          <div class="card">
            <div class="card-header">
              <h5 class="card-title mb-0">Users</h5>
            </div>
            <div class="card-body">
              <div class="list-group" id="usersList">
                <!-- Users will be populated here -->
              </div>
            </div>
          </div>
        </div>

        <!-- Wishlist Section -->
        <div class="col-md-8">
          <div class="card">
            <div class="card-header">
              <h5 class="card-title mb-0">
                Wishlist for:
                <span id="selectedUserName">No user selected</span>
              </h5>
            </div>
            <div class="card-body">
              <div class="row" id="wishlistContainer">
                <!-- Wishlist items will be populated here -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
